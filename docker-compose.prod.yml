version: '3.3'

services:

  backend:
    # v1.5.1 = v1.5.0 + security fixes; built by docker/backend.patch.Dockerfile.
    # Published under biswasaneel/ until there is push access to bioliners/trend.
    # For a full from-scratch image use docker/backend.Dockerfile.
    volumes:
    #  - ./bioinformatics-programs:/app/bioinformatics-programs:ro
    #  - ./util:/app/util
      - ./application.properties:/app/application.properties:ro
    restart: unless-stopped
    env_file: .env
    environment:
      - SPRING_DATASOURCE_URL
      - SPRING_DATASOURCE_USERNAME
      - SPRING_DATASOURCE_PASSWORD
      - SPRING_CONFIG_LOCATION=/app/application.properties
    depends_on:
      - db
    networks:
      - trend-net
    image: biswasaneel/trend:v1.5.1

  db:
    image: postgres:15
    restart: always
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - trend-net

  nginx:
    # Pinned so security updates are explicit and `docker compose up` pulls the new
    # image instead of reusing a stale cached one. 1.30.7 fixes the Nov 18 2026
    # advisories (CVE-2026-123007, -123633, -121810, -123634, -113425, -118899,
    # -125283, -120967, -123640).
    # Debian-based, not -alpine: Alpine 3.24's musl writes files with pwritev2(), which
    # older Docker seccomp profiles block with EPERM, so nginx:1.30.7-alpine dies at
    # startup with `pwrite() "/run/nginx.pid" failed`.
    image: nginx:1.30.7
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /usr/share/nginx/html:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - trend-net

volumes:
  db_data:

networks:
  trend-net:
    driver: bridge
