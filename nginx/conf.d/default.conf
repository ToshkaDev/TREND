# ===============================
# HTTP server
# ===============================
server {
    listen 80;
    listen [::]:80;
    server_name trend.evobionet.com;

    # Always serve ACME challenges over HTTP (no redirect)
    location ^~ /.well-known/acme-challenge/ {
         root /usr/share/nginx/html;
         default_type "text/plain";
         try_files $uri =404;
    }

    # Everything else redirects to HTTPS
    location / {
         return 301 https://$host$request_uri;
    }

}


# ===============================
# HTTPS server
# ===============================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name trend.evobionet.com;

    resolver 127.0.0.11;

    ssl_certificate /etc/letsencrypt/live/trend.evobionet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trend.evobionet.com/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    client_max_body_size 8096M;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
