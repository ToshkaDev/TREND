version: "3.3"

services:
  backend:
    # Uncomment to build an image
    # build:
    #   context: .
    #   dockerfile: docker/backend.Dockerfile
    volumes:
      - ./src/main/resources/application.properties:/app/application.properties:ro
    env_file: .env
    environment:
      - SPRING_DATASOURCE_URL
      - SPRING_DATASOURCE_USERNAME
      - SPRING_DATASOURCE_PASSWORD
      - SPRING_CONFIG_LOCATION=/app/application.properties
    depends_on:
      - db
    networks:
      - trend-net
    image: bioliners/trend:v1.5.0

  db:
    image: postgres:15
    restart: always
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - trend-net

  nginx:
    # Pinned (was the floating `stable-alpine` tag) so security updates are explicit
    # and `docker-compose up` pulls the new image instead of reusing a stale cached one.
    # 1.30.7 fixes the Nov 18 2026 advisories (CVE-2026-123007, -123633, -121810,
    # -123634, -113425, -118899, -125283, -120967, -123640).
    image: nginx:1.30.7-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt/live/trend.evobionet.com/fullchain.pem:/etc/letsencrypt/live/trend.evobionet.com/fullchain.pem
      - /etc/letsencrypt/live/trend.evobionet.com/privkey.pem:/etc/letsencrypt/live/trend.evobionet.com/privkey.pem
    depends_on:
      - backend
    networks:
      - trend-net

volumes:
  db_data:

networks:
  trend-net:
    driver: bridge
